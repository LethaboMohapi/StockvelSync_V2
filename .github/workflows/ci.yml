name: CSharp and MySQL checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: stokvelsync_tests
          MYSQL_USER: stokvelsync
          MYSQL_PASSWORD: ci-test-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-only"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet restore StokvelSync.sln
      - run: dotnet build StokvelSync.sln -c Release --no-restore
      - run: dotnet test StokvelSync.sln -c Release --no-build --logger trx
        env:
          STOKVELSYNC_TEST_MYSQL: 'Server=127.0.0.1;Port=3306;Database=stokvelsync_tests;User ID=stokvelsync;Password=ci-test-only;'
