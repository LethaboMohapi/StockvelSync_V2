services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: stokvelsync
      MYSQL_USER: stokvelsync
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-this-local-db-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-this-local-root-password}
    ports: ["127.0.0.1:3307:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql --protocol=tcp -h 127.0.0.1 -u $$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    build: .
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
    ports: ["127.0.0.1:5080:8080"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__MySql: "Server=mysql;Port=3306;Database=stokvelsync;User ID=stokvelsync;Password=${MYSQL_PASSWORD:-change-this-local-db-password};"
      App__PublicUrl: http://localhost:5080
      App__CookieSecure: "false"
      Payments__Provider: sandbox
      Sms__Provider: console
volumes:
  mysql_data:
